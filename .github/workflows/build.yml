name: Android Build

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    name: Build Hide-My-Applist
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v3  # ✅ 使用新版验证器

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Set Gradle memory options
      run: echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build xposed module (release)
      run: ./gradlew :xposed:assembleRelease
      env:
        CI: true  # ✅ 禁用 Magic 签名生成

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hide-My-Applist-APK
        path: xposed/build/outputs/apk/release/*.apk
