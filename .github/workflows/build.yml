name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Hide-My-Applist
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew :xposed:assembleRelease
      env:
        CI: true  # 👈 传入 CI 环境变量，禁用签名生成

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hide-My-Applist-APK
        path: xposed/build/outputs/apk/release/*.apk  # 👈 注意：路径改为 xposed 模块
